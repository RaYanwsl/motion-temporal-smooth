[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-temporal-smooth"
version = "0.1.0"
description = "视频人体关节轨迹的时序平滑和触地约束"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "RaYanwsl" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
motion-smooth = "motion_smooth.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
